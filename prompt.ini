Create a small but realistic **Python Flask REST API project** that will be used as the baseline Git repository for testing an AI development agent called DEVAA.

### Project

Build a simple **User Management API** with the following functionality:

* Flask REST API
* SQLite database using SQLAlchemy
* User model with:

  * id
  * name
  * email
  * password
  * created_at
* `POST /users` — create/register a user
* `GET /users` — return all users
* `GET /users/<id>` — return a specific user
* `DELETE /users/<id>` — delete a user
* Basic error handling
* Unit tests using pytest
* `requirements.txt`
* `.env.example`
* `README.md`

### Important Baseline Condition

The repository must represent the **initial/baseline version before the following requirement is implemented**:

> Add email format validation to the user registration API.

Therefore, intentionally DO NOT implement:

* Email format validation
* Regex/email-validator based validation
* Special validation errors for invalid email addresses
* Tests specifically checking invalid email formats

The current `POST /users` endpoint should accept the email as a normal string and otherwise perform basic required-field validation.

### Code Quality

Structure the project cleanly so an AI coding agent can analyze it and determine where changes should be made.

Suggested structure:

```text
user-management-api/
├── app/
│   ├── __init__.py
│   ├── models.py
│   ├── routes/
│   │   └── users.py
│   ├── services/
│   │   └── user_service.py
│   └── extensions.py
├── tests/
│   ├── test_users.py
│   └── conftest.py
├── config.py
├── run.py
├── requirements.txt
├── .env.example
├── .gitignore
└── README.md
```

Use clear separation between routes, services, models, configuration, and tests.

### Baseline Tests

Include tests for:

* Successful user creation
* Missing required fields
* Getting users
* Getting user by ID
* Deleting a user

All baseline tests should pass.

### Git Readiness

Make the project runnable locally with simple instructions in the README.

Do not add unnecessary complexity. The purpose of this repository is to allow DEVAA to:

1. Read a Jira story.
2. Analyze this repository.
3. Identify the registration endpoint and relevant files.
4. Implement email validation.
5. Add appropriate tests.
6. Run validation/tests.
7. Create a feature branch and PR.

Generate the complete working project with clean, production-style Python code.
